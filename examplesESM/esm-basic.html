    <div class="content narrow">
        <h1>Basic Example</h1>

        <div class="alert alert-info">
            <strong>Introduction:</strong> This example demonstrates the fundamentals of Calx.js including cell references, simple formulas, and automatic calculation.
        </div>

    <form id="calx_form">
        <div class="form-group">
            <label>Price:</label>
            <input type="number" data-cell="A1" value="100" placeholder="Enter price">
        </div>

        <div class="form-group">
            <label>Quantity:</label>
            <input type="number" data-cell="A2" value="5" placeholder="Enter quantity">
        </div>

        <div class="form-group">
            <label>Tax Rate (%):</label>
            <input type="number" data-cell="A3" value="10" placeholder="Enter tax rate">
        </div>

        <div class="result">
            <div class="form-group">
                <label>Subtotal:</label>
                <input type="text" data-cell="B1" data-formula="=A1*A2" readonly>
            </div>

            <div class="form-group">
                <label>Tax Amount:</label>
                <input type="text" data-cell="B2" data-formula="=B1*(A3/100)" readonly>
            </div>

            <div class="form-group">
                <label>Total:</label>
                <input type="text" data-cell="B3" data-formula="=B1+B2" readonly>
            </div>
        </div>
    </form>

    <footer class="footer">
        <p>
            <a href="index.html">← Back to Examples</a> |
            <a href="https://github.com/xsanisty/calx.js" target="_blank">GitHub</a>
        </p>
    </footer>
    </div>

    <!-- Load Calx.js as ES Module -->
    <script type="module">
        import { Calx } from '../dist/calx.esm.js';

        // Create workbook from the form element
        // Auto-calculation and DOM updates are automatic!
        const element = document.getElementById('calx_form');
        const workbook = Calx.createWorkbookFromElement(element);

        // That's it! The workbook automatically:
        // - Reads data attributes
        // - Sets up event listeners
        // - Calculates on input changes
        // - Updates the DOM with results

        console.log('Calx.js initialized!', workbook);
        console.log('Sheet:', workbook.getSheet('calx_form'));
    </script>
</body>
